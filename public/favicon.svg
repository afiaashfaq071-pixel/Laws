<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <!-- Background -->
  <rect width="600" height="900" fill="#E33D0D"/>
  
  <!-- Central Blue Bar -->
  <rect x="190" y="0" width="220" height="900" fill="#12237D"/>
  
  <!-- THE 48 LAWS OF -->
  <text x="300" y="35" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="400" letter-spacing="3.5" fill="#C9A96E" text-anchor="middle">THE 48 LAWS OF</text>

  <!-- POWER Vertical -->
  <g font-family="Georgia, Times New Roman, serif" font-weight="400" fill="#C9A96E" text-anchor="middle">
    <text x="300" y="185" font-size="96" letter-spacing="4">P</text>
    <text x="300" y="310" font-size="96" letter-spacing="4">O</text>
    <text x="300" y="440" font-size="96" letter-spacing="4">W</text>
    <text x="300" y="570" font-size="96" letter-spacing="4">E</text>
    <text x="300" y="695" font-size="96" letter-spacing="4">R</text>
  </g>

  <!-- ROBERT GREENE -->
  <text x="300" y="760" font-family="Georgia, Times New Roman, serif" font-size="15" letter-spacing="3.2" fill="#C9A96E" text-anchor="middle">ROBERT GREENE</text>
  
  <!-- A JOOST ELFFERS BOOK -->
  <text x="300" y="788" font-family="Georgia, Times New Roman, serif" font-size="9.5" letter-spacing="2.2" fill="#8B1A1A" text-anchor="middle">A JOOST ELFFERS BOOK</text>

  <!-- Penguin Logo -->
  <g transform="translate(300, 840)">
    <ellipse cx="0" cy="0" rx="18" ry="22" fill="#FF6F00" stroke="#000" stroke-width="0.5"/>
    <ellipse cx="0" cy="2" rx="10" ry="16" fill="white"/>
    <path d="M -3 -10 C -1 -14, 3 -14, 5 -10 L 2 -6 L -1 -6 Z" fill="black"/>
    <circle cx="-2" cy="-8" r="1" fill="white"/>
  </g>

  <!-- NATIONAL BESTSELLER Badge -->
  <g transform="translate(95, 115)">
    <!-- Serrated edge -->
    <g fill="#DDBB6B" stroke="#DDBB6B" stroke-width="1">
      <circle cx="0" cy="0" r="65"/>
      <!-- create serrated effect with small triangles around -->
      <g id="serration">
        <path d="M 0,-65 L 4,-72 L -4,-72 Z" />
      </g>
      <!-- 36 serrations -->
      <use href="#serration" transform="rotate(0)"/>
      <use href="#serration" transform="rotate(10)"/>
      <use href="#serration" transform="rotate(20)"/>
      <use href="#serration" transform="rotate(30)"/>
      <use href="#serration" transform="rotate(40)"/>
      <use href="#serration" transform="rotate(50)"/>
      <use href="#serration" transform="rotate(60)"/>
      <use href="#serration" transform="rotate(70)"/>
      <use href="#serration" transform="rotate(80)"/>
      <use href="#serration" transform="rotate(90)"/>
      <use href="#serration" transform="rotate(100)"/>
      <use href="#serration" transform="rotate(110)"/>
      <use href="#serration" transform="rotate(120)"/>
      <use href="#serration" transform="rotate(130)"/>
      <use href="#serration" transform="rotate(140)"/>
      <use href="#serration" transform="rotate(150)"/>
      <use href="#serration" transform="rotate(160)"/>
      <use href="#serration" transform="rotate(170)"/>
      <use href="#serration" transform="rotate(180)"/>
      <use href="#serration" transform="rotate(190)"/>
      <use href="#serration" transform="rotate(200)"/>
      <use href="#serration" transform="rotate(210)"/>
      <use href="#serration" transform="rotate(220)"/>
      <use href="#serration" transform="rotate(230)"/>
      <use href="#serration" transform="rotate(240)"/>
      <use href="#serration" transform="rotate(250)"/>
      <use href="#serration" transform="rotate(260)"/>
      <use href="#serration" transform="rotate(270)"/>
      <use href="#serration" transform="rotate(280)"/>
      <use href="#serration" transform="rotate(290)"/>
      <use href="#serration" transform="rotate(300)"/>
      <use href="#serration" transform="rotate(310)"/>
      <use href="#serration" transform="rotate(320)"/>
      <use href="#serration" transform="rotate(330)"/>
      <use href="#serration" transform="rotate(340)"/>
      <use href="#serration" transform="rotate(350)"/>
    </g>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#12237D" stroke-width="2.5"/>
    <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12.5" fill="#000" text-anchor="middle" letter-spacing="0.8">
      <line x1="-10" y1="-28" x2="10" y2="-28" stroke="#000" stroke-width="1.2"/>
      <text x="0" y="-10">NATIONAL</text>
      <text x="0" y="9">BESTSELLER</text>
      <line x1="-10" y1="22" x2="10" y2="22" stroke="#000" stroke-width="1.2"/>
    </g>
  </g>
</svg>
